# Avisos da bolsa no Telegram (horário de Brasília).
#   (os proventos de FIIs, ações, JCP e bonificação saem NA HORA, pelo workflow proventos-agora.yml, a cada 15 minutos das 9h às 21h)
#   FECHAMENTO (maiores altas e baixas + dólar e cripto): começa às 20h00 e TENTA DE NOVO A CADA 30 MINUTOS (20h30, 21h00, 21h30, 22h00, 22h30, 23h00, 23h30)
#                  até sair. O arquivo de fechamento da B3 é publicado numa hora que só a B3 decide; assim que ele aparece, a próxima tentativa envia. Depois de enviado, as outras tentativas não fazem nada.
#   21h    atualizações da B3 (mudança de código, novos listados), a partir da 1ª tentativa das 21h (novas tentativas até 23h30)
#   22h    resumo do dia: dividendos, JCP e bonificações anunciados hoje, em uma lista só
#   22h30  proventos que só saíram depois do resumo (só envia o que ainda não foi enviado)
# Cada parte envia uma única vez por dia. Precisa dos segredos TELEGRAM_BOT_TOKEN e TELEGRAM_CHAT_ID.
name: Aviso diário no Telegram
on:
  schedule:
    - cron: '0 23 * * *'     # 20h00 fechamento
    - cron: '30 23 * * *'    # 20h30 fechamento (tentativa 2)
    - cron: '0 0 * * *'      # 21h00 fechamento (tentativa 3) + atualizações da B3
    - cron: '30 0 * * *'     # 21h30 fechamento (tentativa 4) + atualizações da B3
    - cron: '0 1 * * *'      # 22h00 fechamento (tentativa 5) + resumo do dia + atualizações da B3
    - cron: '30 1 * * *'     # 22h30 fechamento (tentativa 6) + proventos da noite + atualizações da B3
    - cron: '0 2 * * *'      # 23h00 fechamento (tentativa 7) + atualizações da B3
    - cron: '30 2 * * *'     # 23h30 fechamento (última tentativa) + atualizações da B3
  workflow_dispatch:
    inputs:
      parte:
        description: 'Qual parte rodar'
        type: choice
        options: [tudo, fechamento, resumo, proventos, eventos, 'fechamento,eventos', 'fechamento,resumo,eventos', 'fechamento,proventos,eventos']   # as combinações são usadas pelo relógio da Cloudflare
        default: tudo
      teste:
        description: 'Só mostrar as mensagens no log, sem enviar'
        type: boolean
        default: false
      forcar:
        description: 'Enviar de novo as mensagens de hoje'
        type: boolean
        default: false
      proventos:
        description: 'Enviar também os proventos (em teste, sempre aparecem no log)'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: planob-dados
  cancel-in-progress: false
jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Atualizar o fechamento de hoje
        continue-on-error: true
        run: node gerar-dados.mjs bolsa-hoje
      - name: Atualizar proventos (experimental)
        continue-on-error: true
        run: node gerar-dados.mjs proventos
      - name: Enviar ao Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PARTE: ${{ github.event_name == 'workflow_dispatch' && inputs.parte || (github.event.schedule == '30 1 * * *' && 'fechamento,proventos,eventos' || (github.event.schedule == '0 1 * * *' && 'fechamento,resumo,eventos' || (github.event.schedule == '0 23 * * *' && 'fechamento' || (github.event.schedule == '30 23 * * *' && 'fechamento' || 'fechamento,eventos')))) }}
          TESTE: ${{ inputs.teste && '1' || '' }}
          FORCAR: ${{ inputs.forcar && '1' || '' }}
          PROVENTOS_ENVIAR: ${{ github.event_name == 'schedule' && '1' || (inputs.proventos && '1' || '0') }}   # nos horários automáticos os proventos são enviados; à mão, só se marcar "proventos"
        run: node telegram.mjs
      - name: Salvar
        if: always()
        run: |
          git config user.name "dados-automaticos"
          git config user.email "dados@users.noreply.github.com"
          git add saida
          git diff --cached --quiet || git commit -m "Aviso diário: atualiza fechamento, proventos e estado do envio"
          git pull --rebase
          git push
