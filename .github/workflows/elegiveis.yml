# Lista de empresas elegíveis do Plano B (2 vezes por dia, segunda a sexta: 6h e 22h de Brasília; e quando você mandar rodar):
#   só entram empresas com lucro líquido positivo e dividendos/JCP pagos em TODOS os últimos 5 anos (balanços anuais da CVM).
# O noticiário usa essa lista (saida/elegiveis.json). Exceções à mão: campo "excecoes" do destaques.json.
# Para conferir: abra saida/elegiveis-diag.json (campo "conferir" mostra empresas conhecidas ano a ano) e saida/elegiveis.json.
name: Lista de empresas elegíveis (lucro e dividendos)
on:
  schedule:
    - cron: '0 9 * * 1-5'    # 6h00 de Brasília, segunda a sexta
    - cron: '0 1 * * 2-6'    # 22h00 de Brasília, segunda a sexta
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: planob-elegiveis   # grupo próprio: não atrasa nem cancela os envios do Telegram (só mexe em saida/elegiveis*.json)
  cancel-in-progress: false
jobs:
  elegiveis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Calcular a lista
        run: node elegiveis.mjs
      - name: Salvar
        if: always()
        run: |
          git config user.name "dados-automaticos"
          git config user.email "dados@users.noreply.github.com"
          git add saida/elegiveis.json saida/elegiveis-diag.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Elegíveis: atualiza lista de empresas (lucro e dividendos)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
