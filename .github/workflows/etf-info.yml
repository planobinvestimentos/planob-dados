# ETFs: valor patrimonial por cota (dias úteis, 9h30 de Brasília, e à mão):
#   lê o informe diário dos fundos da CVM e grava saida/etf-info.json (VP por cota de cada ETF listado em raiz/etfs-cnpj.json).
#   O site usa esse número para o P/VP dos ETFs. Não envia nada ao Telegram.
# Para ligar um ETF, preencha o CNPJ dele em raiz/etfs-cnpj.json (pelo GitHub, lápis) e rode o workflow à mão.
name: ETFs: valor patrimonial por cota
on:
  schedule:
    - cron: '30 12 * * 1-5'   # 9h30 de Brasília, dias úteis
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: planob-dados
  cancel-in-progress: false
jobs:
  etf-info:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Valor patrimonial por cota dos ETFs (informe diário da CVM)
        run: node etf-info.mjs
      - name: Salvar
        if: always()
        run: |
          git config user.name "dados-automaticos"
          git config user.email "dados@users.noreply.github.com"
          git add saida
          git diff --cached --quiet || git commit -m "ETFs: atualiza valor patrimonial por cota"
          git pull --rebase
          git push
